name: Refresh Dotabuff data
on:
  schedule: [{ cron: "17 */12 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public
          git diff --cached --quiet || (git commit -m "chore: refresh matchup data" && git push)
